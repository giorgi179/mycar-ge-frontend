<div class="lang-selector">
  <button
    type="button"
    class="lang-selector__trigger"
    (click)="toggleDropdown()"
    [class.lang-selector__trigger--open]="isOpen()"
  >
    <svg class="lang-selector__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
      <path d="M3 12H21" stroke="currentColor" stroke-width="1.5"/>
      <path d="M12 3C14.5 5.5 15.5 8.5 15.5 12C15.5 15.5 14.5 18.5 12 21C9.5 18.5 8.5 15.5 8.5 12C8.5 8.5 9.5 5.5 12 3Z" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <span class="lang-selector__label">{{ currentLabel() }}</span>
    <svg
      class="lang-selector__chevron"
      [class.lang-selector__chevron--open]="isOpen()"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  @if (isOpen()) {
    <div class="lang-selector__dropdown">
      <div class="lang-selector__header">{{ 'language.select' | translate }}</div>
      @for (option of options; track option.code) {
        <button
          type="button"
          class="lang-selector__option"
          [class.lang-selector__option--active]="langService.currentLang() === option.code"
          (click)="selectLang(option.code)"
        >
          <span class="lang-selector__radio">
            @if (langService.currentLang() === option.code) {
              <span class="lang-selector__radio-dot"></span>
            }
          </span>
          <span>{{ option.label }}</span>
        </button>
      }
    </div>
  }
</div>
