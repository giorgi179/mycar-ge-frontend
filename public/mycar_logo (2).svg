<rect x="148" y="14" width="38" height="36" rx="10" fill="#FF4500"/>
<text x="167" y="37" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">.ge</text>
</svg>
