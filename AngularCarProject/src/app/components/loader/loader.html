<div class="loader" [class.loader--open]="gatesOpen" role="status" aria-live="polite">

  <!-- სალონის კარიბჭეები: იშლება ჩატვირთვის დასრულებისას -->
  <div class="loader__gate loader__gate--left"></div>
  <div class="loader__gate loader__gate--right"></div>

  <div class="loader__stage">

    <span class="loader__pinstripe"></span>

    <svg
      class="loader__car"
      viewBox="0 0 240 90"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path
        class="loader__car-path"
        d="M20 62 C20 62 28 40 55 36 L92 36 C100 26 112 20 128 20 C146 20 160 28 168 36 L196 36
           C210 36 220 46 220 58 L220 62
           M20 62 L14 62 M220 62 L226 62
           M60 62 A12 12 0 1 0 60 61.9
           M172 62 A12 12 0 1 0 172 61.9"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

    <div class="loader__brand">
      <span class="loader__brand-text">{{ brand }}</span>
      <span class="loader__brand-line"></span>
    </div>

    <p class="loader__tagline">{{ tagline || ('home.loaderTagline' | translate) }}</p>

    <div class="loader__progress">
      <div class="loader__progress-track">
        <div class="loader__progress-fill" [style.width.%]="displayProgress"></div>
      </div>
      <span class="loader__progress-value">{{ displayProgress }}%</span>
    </div>

  </div>
</div>
